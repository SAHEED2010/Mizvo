name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mizvo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mizvo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Check auth schema regeneration
        run: pnpm --filter @mizvo/database db:auth-schema:check

      - name: Install Chromium for WebAuthn integration test
        run: pnpm --filter @mizvo/api exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mizvo_test

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check
